[package]
name = "motarem_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "motarem_core"
path = "src/lib.rs"


[dependencies]
async-trait = "0.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
moka = { version = "0.12.11", features = ["future"] }

[package]
name = "motarem_server"
version = "0.1.0"
edition = "2021"

[lib]
name = "motarem_server"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
anyhow = "1.0"
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = "0.3"

motarem_core = { path = "../motarem_core" }
motarem_proto = { path = "../motarem_proto" }
